services:
  - type: web
    name: impulso-gym
    runtime: python
    plan: starter
    buildCommand: bash scripts/build.sh
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile - --error-logfile -
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: DEBUG
        value: 'False'
      - key: DEMO_MODE
        value: 'False'
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: impulso-gym-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: TRUST_PROXY
        value: 'True'
      - key: GYM_NAME
        value: Impulso Gym
databases:
  - name: impulso-gym-db
    databaseName: impulso
    user: impulso
    plan: basic-256mb
