services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: impulso
      POSTGRES_USER: impulso
      POSTGRES_PASSWORD: local-development-only
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U impulso']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
